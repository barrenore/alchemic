name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# The Postgres service container in the test jobs trusts local connections, so
# the URL has no password. tests/conftest.py creates an isolated
# `alchemic_ci_<hex>` database per process and drops it at exit.
env:
  ALCHEMIC_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres@localhost:5432/postgres

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # Require type-checker tests and Postgres tests to run rather than skip.
      - name: Run tests with coverage gate
        env:
          ALCHEMIC_REQUIRE_TYPECHECK: "1"
          ALCHEMIC_REQUIRE_POSTGRES: "1"
        run: uv run --python ${{ matrix.python-version }} --extra dev pytest --cov=alchemic --cov-report=term-missing --cov-fail-under=90

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev black --check src tests
      - run: uv run --extra dev pylint src/alchemic
      - run: uv run --extra dev pyright
      - run: uv run --extra dev pyright --verifytypes alchemic --ignoreexternal
      - run: uv run --extra dev ty check

  # The lowest SQLAlchemy and Pydantic that pyproject.toml allows. Installing the
  # package alone with lowest-direct pins those two; the dev tools are then added
  # at their latest without moving them.
  minimum-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install the minimum versions
        run: |
          set -euo pipefail
          uv venv --python 3.13
          uv pip install --resolution lowest-direct -e .
          uv pip install -e ".[dev]"
          .venv/bin/python -c "import sqlalchemy, pydantic; print('SQLAlchemy', sqlalchemy.__version__, 'Pydantic', pydantic.VERSION)"
      - name: Run tests
        env:
          ALCHEMIC_REQUIRE_TYPECHECK: "1"
          ALCHEMIC_REQUIRE_POSTGRES: "1"
        run: .venv/bin/python -m pytest

  # Type-check package source with mypy in strict mode. Consumer code type safety
  # is covered by tests/test_typing.py.
  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv run --extra dev mypy --strict src
